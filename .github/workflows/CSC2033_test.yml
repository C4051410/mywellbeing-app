#name of Github Action CI
name: CSC2033 CI Test

# used to determine when it wil be run
on:
  #will run when a pull request is done on main branch
  pull_request:
    branches:
      - main
  #will run when push request is done on any branch NOT main
  push:
    branches-ignore:
      - main
# the jobs that will be tested
jobs:
  test:
    #sets up tests on ubuntu on the latest version
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: csc2033_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      #check the repository is valid
      - name: "Checks Repository"
        uses: actions/checkout@v4
      #makes sure src is set up properly
      - name: "Set Up Python"
        uses: actions/setup-python@v5
        with:
          #specifies src version
          python-version: "3.11"
      #install dependencies code needs to run
      - name: "Install Dependencies"
        #uses src to make sure pip is up to date and install requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: "Initialize Database Schema"
        env:
          PGPASSWORD: password123
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U test_admin -d csc2033_test -f src/tests/integration/schema.sql

      - name: "Run Tests with pytest"
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          DATABASE_URL: postgresql://test_admin:password123@localhost:5432/csc2033_test
          EMAIL_KEY: "fake_key"
          DISPLAY: :99.0
        run: |
          pytest src/tests
          
